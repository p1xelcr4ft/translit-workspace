<!DOCTYPE html>
<html lang="ru" class="dark-theme">
<head>
    <meta charset="UTF-8">
    <title>Translit Workspace</title>
    <style>
        :root {
            --bg-main: #ffffff;
            --bg-sidebar: #f7f7f5;
            --bg-card: #fdfdfd;
            --text-main: #37352f;
            --text-muted: #7c7b77;
            --border-color: #ededeb;
            --accent-color: #2383e2;
            --accent-hover: #1a66b8;
            --radius: 8px;
        }

        .dark-theme {
            --bg-main: #191919;
            --bg-sidebar: #202020;
            --bg-card: #252525;
            --text-main: #ffffff;
            --text-muted: #9b9b9b;
            --border-color: #2a2a2a;
            --accent-color: #2eaadc;
            --accent-hover: #1c86b3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background 0.2s, color 0.2s;
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        aside {
            width: 240px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px;
            flex-shrink: 0;
        }

        .nav-group h4 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 12px;
            padding-left: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
            transition: background 0.15s;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--border-color);
        }

        .nav-item.active { color: var(--accent-color); }

        .settings-group {
            display: flex;
            gap: 8px;
        }

        main {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            overflow-y: auto;
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex: 1;
        }

        textarea {
            width: 100%;
            height: 100%;
            min-height: 300px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px;
            color: var(--text-main);
            font-size: 16px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus { border-color: var(--accent-color); }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 500;
            transition: background 0.15s;
        }
        .btn:hover { background: var(--accent-hover); }

        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 13px;
            flex: 1;
            text-align: center;
        }

        .app-container.tabs-layout {
            flex-direction: column;
        }
        .app-container.tabs-layout aside {
            width: 100%;
            height: 60px;
            flex-direction: row;
            border-right: none;
            border-bottom: 1px solid var(--border-color);
            padding: 0 40px;
            align-items: center;
        }
        .app-container.tabs-layout .nav-group { display: flex; align-items: center; gap: 8px; }
        .app-container.tabs-layout .nav-group h4 { display: none; }
        .app-container.tabs-layout .nav-item { margin-bottom: 0; }
        .app-container.tabs-layout .settings-group { width: auto; }
    </style>
</head>
<body>

<div class="app-container" id="appContainer">
    <aside>
        <div class="nav-group">
            <h4>Режимы транслита</h4>
            <div class="nav-item" data-mode="basic">Обычный текст</div>
            <div class="nav-item active" data-mode="seo">SEO URL (ЧПУ)</div>
            <div class="nav-item" data-mode="passport">Для ФИО (МИД)</div>
            <div class="nav-item" data-mode="gost">По ГОСТу</div>
        </div>
        
        <div class="settings-group">
            <button class="theme-toggle" id="themeBtn">🌓 Тема</button>
            <button class="theme-toggle" id="layoutBtn">🔄 Вид</button>
        </div>
    </aside>

    <main>
        <div class="toolbar">
            <h2 id="currentModeTitle">SEO URL (ЧПУ)</h2>
            <div style="display: flex; gap: 10px; align-items: center;">
                <span style="font-size: 12px; color: var(--text-muted);">Хоткей: <b>Ctrl+Shift+T</b> или <b>Ctrl+Alt+T</b></span>
                <button class="btn" id="translitClipboardBtn" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 12px; font-size: 13px;">📋 Буфер</button>
                <button class="btn" id="copyBtn">Скопировать</button>
            </div>
        </div>

        <div class="workspace">
            <textarea id="inputText" placeholder="Введите или вставьте русский текст..."></textarea>
            <textarea id="outputText" placeholder="Результат..." readonly></textarea>
        </div>
    </main>
</div>

<script>
    const { translit } = require('./translitEngine.js');
    const { ipcRenderer } = require('electron');

    let currentMode = 'seo';
    const input = document.getElementById('inputText');
    const output = document.getElementById('outputText');

    function updateTranslation() {
        output.value = translit(input.value, currentMode);
    }

    input.addEventListener('input', updateTranslation);

    function selectMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.nav-item').forEach(el => {
            if (el.getAttribute('data-mode') === mode) {
                el.classList.add('active');
                document.getElementById('currentModeTitle').innerText = el.innerText;
            } else {
                el.classList.remove('active');
            }
        });
        updateTranslation();
    }

    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', (e) => {
            const mode = e.target.getAttribute('data-mode');
            selectMode(mode);
            ipcRenderer.send('set-mode', mode);
        });
    });

    ipcRenderer.on('mode-changed', (event, mode) => {
        selectMode(mode);
    });

    document.getElementById('translitClipboardBtn').addEventListener('click', () => {
        ipcRenderer.send('translit-clipboard');
    });

    document.getElementById('themeBtn').addEventListener('click', () => {
        const html = document.documentElement;
        if (html.classList.contains('light-theme')) {
            html.classList.replace('light-theme', 'dark-theme');
        } else {
            html.classList.replace('dark-theme', 'light-theme');
        }
    });

    document.getElementById('layoutBtn').addEventListener('click', () => {
        document.getElementById('appContainer').classList.toggle('tabs-layout');
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
        if (output.value) {
            navigator.clipboard.writeText(output.value);
            const originalText = document.getElementById('copyBtn').innerText;
            document.getElementById('copyBtn').innerText = 'Скопировано! ✓';
            setTimeout(() => {
                document.getElementById('copyBtn').innerText = originalText;
            }, 1500);
        }
    });
</script>
</body>
</html>
